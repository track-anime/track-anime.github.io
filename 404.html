<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script>
        /**
         * GitHub Pages отдаёт этот файл для /anime/:id и других неизвестных путей.
         * Маршруты сайта → экран «Подбор сервера» (без вспышки декоративного 404).
         */
        (function () {
            var path = window.location.pathname || "/";
            var shouldRoute =
                /^\/anime\/\d+/i.test(path) ||
                /^\/(history|favorites|calendar|search|app|login|user|admin)(\/|$)/i.test(path);
            window.__TA_ROUTE_PATH = path;
            if (shouldRoute) {
                document.documentElement.setAttribute("data-route", "1");
                document.title = "Подбор сервера | Track Anime";
            } else {
                document.title = "TA: 404";
            }
        })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        /* Режим роутинга: только picker; иначе — только декоративный 404 */
        html[data-route] .not-found {
            display: none !important;
        }

        html:not([data-route]) .picker {
            display: none !important;
        }

        :root {
            color-scheme: dark;
            --bg: #101114;
            --panel: #181a20;
            --text: #f3f4f6;
            --muted: #a5adba;
            --accent: #57d39b;
            --danger: #ff6b6b;
            --border: #2d313a;
            --nf-bg: #0c0e14;
            --nf-accent: #6c8cff;
            --nf-border: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        /* —— Mirror picker (как index.htm) —— */
        html[data-route],
        html[data-route] body {
            min-height: 100%;
            margin: 0;
        }

        html[data-route] body {
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #1c2430 0, var(--bg) 42%);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .picker {
            width: min(100%, 520px);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            box-shadow: 0 24px 80px rgb(0 0 0 / 0.35);
            text-align: center;
        }

        .logo-wrap {
            width: min(76vw, 260px);
            height: min(76vw, 260px);
            margin: 0 auto 26px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0c0d10;
            overflow: hidden;
        }

        #brandLogo {
            display: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .fallback-logo {
            color: var(--accent);
            font-size: 64px;
            font-weight: 700;
        }

        .picker h1 {
            margin: 0 0 12px;
            font-size: 28px;
            font-weight: 700;
        }

        .picker p {
            margin: 0;
        }

        #status {
            min-height: 48px;
            color: var(--muted);
            line-height: 1.5;
        }

        #serverName {
            margin-top: 16px;
            color: var(--text);
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        #routePath {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            overflow-wrap: anywhere;
        }

        .loader {
            width: 40px;
            height: 40px;
            margin: 22px auto 0;
            border: 4px solid #30343d;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 900ms linear infinite;
        }

        .error {
            color: var(--danger);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* —— Decorative 404 (прежний вид) —— */
        html:not([data-route]),
        html:not([data-route]) body {
            min-height: 100%;
            margin: 0;
        }

        html:not([data-route]) body {
            overflow: hidden;
            background: var(--nf-bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            user-select: none;
        }

        .not-found.scene {
            position: relative;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            overflow: hidden;
            isolation: isolate;
            padding: clamp(1rem, 5vw, 4rem);
            animation: cursor-spin 0.4s steps(1, end) infinite;
        }

        .bg-video {
            position: absolute;
            inset: 0;
            z-index: -3;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(18px) saturate(1.15);
            transform: scale(1.08);
            opacity: 0.72;
        }

        .vignette {
            position: absolute;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.55) 100%),
                linear-gradient(180deg, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.55));
        }

        .stage {
            position: absolute;
            inset: 0;
            z-index: -1;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .center-video {
            width: min(52vw, 28rem);
            height: auto;
            max-height: 70dvh;
            border-radius: 12px;
            object-fit: cover;
            box-shadow: 0 0 0 1px var(--nf-border);
        }

        .code {
            position: absolute;
            font-size: clamp(5.5rem, 18vw, 11rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            color: rgba(238, 240, 244, 0.42);
            text-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
        }

        .code-left {
            left: 4%;
            top: 12%;
        }

        .code-right {
            right: 4%;
            bottom: 12%;
        }

        .content {
            position: relative;
            z-index: 1;
            width: min(100%, 28rem);
            padding: 1.25rem 1.35rem;
            border: 1px solid var(--nf-border);
            border-radius: 14px;
            background: rgba(12, 14, 20, 0.72);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 0.35rem;
            color: var(--nf-accent);
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .content h1 {
            margin: 0 0 0.55rem;
            font-size: 1.45rem;
        }

        .content p {
            margin: 0;
            color: rgba(238, 240, 244, 0.78);
            line-height: 1.45;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .actions a,
        .actions button {
            appearance: none;
            border: 1px solid var(--nf-border);
            border-radius: 999px;
            padding: 0.55rem 1rem;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
            text-decoration: none;
        }

        .actions .primary {
            background: color-mix(in srgb, var(--nf-accent) 28%, transparent);
            border-color: color-mix(in srgb, var(--nf-accent) 55%, transparent);
        }

        @keyframes cursor-spin {
            50% {
                cursor: wait;
            }
        }

        @media (max-width: 420px) {
            .picker {
                padding: 22px;
            }

            .picker h1 {
                font-size: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loader,
            .not-found.scene {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <main class="picker" aria-live="polite">
        <div class="logo-wrap" aria-hidden="true">
            <img id="brandLogo" alt="">
            <div id="fallbackLogo" class="fallback-logo">TA</div>
        </div>
        <h1>Подбор сервера</h1>
        <p id="status">Инициализация...</p>
        <p id="serverName"></p>
        <p id="routePath"></p>
        <div class="loader" aria-hidden="true"></div>
    </main>

    <main class="not-found scene">
        <video class="bg-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="/404.webm" type="video/webm">
        </video>
        <div class="vignette" aria-hidden="true"></div>
        <div class="stage" aria-hidden="true">
            <span class="code code-left">404</span>
            <video class="center-video" autoplay muted loop playsinline preload="metadata">
                <source src="/404.webm" type="video/webm">
            </video>
            <span class="code code-right">404</span>
        </div>
        <section class="content" aria-labelledby="title">
            <p class="eyebrow">Track Anime</p>
            <h1 id="title">Страница не найдена</h1>
            <p>Ссылка устарела или адрес набран с ошибкой. Можно вернуться назад или открыть главную.</p>
            <div class="actions">
                <a class="primary" href="/">На главную</a>
                <button type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Назад</button>
            </div>
        </section>
    </main>

    <script>
        (function () {
            if (!document.documentElement.hasAttribute("data-route")) return;

            const path = window.__TA_ROUTE_PATH || window.location.pathname || "/";
            const MIRRORS = [
                "https://track-anime.dygdyg.ru",
                "https://track-anime.duckdns.org",
                "https://ta.dygdyg.ru",
            ];
            const LOGO_PATH = "/api/brand/logo";
            const TIMEOUT_MS = 4000;
            const REQUIRED_SUCCESSES = 2;
            const RETRY_DELAY_MS = 3000;

            const statusEl = document.getElementById("status");
            const serverNameEl = document.getElementById("serverName");
            const routePathEl = document.getElementById("routePath");
            const logoEl = document.getElementById("brandLogo");
            const fallbackLogoEl = document.getElementById("fallbackLogo");

            routePathEl.textContent = path + window.location.search + window.location.hash;

            const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            function withCacheBust(url) {
                const nextUrl = new URL(url);
                nextUrl.searchParams.set("_", String(Date.now()));
                return nextUrl.href;
            }

            function getLogoUrl(baseUrl) {
                return new URL(LOGO_PATH, baseUrl).href;
            }

            function showScannedMirror(baseUrl, attempt) {
                statusEl.className = "";
                statusEl.textContent = `Проверяем зеркало ${attempt}/${REQUIRED_SUCCESSES}`;
                serverNameEl.textContent = baseUrl;
                fallbackLogoEl.style.display = "grid";
                logoEl.style.display = "none";
                logoEl.removeAttribute("src");
                logoEl.src = withCacheBust(getLogoUrl(baseUrl));
            }

            function checkLogo(baseUrl) {
                return new Promise((resolve) => {
                    const image = new Image();
                    const timer = setTimeout(() => finish(false), TIMEOUT_MS);

                    function finish(isReady) {
                        clearTimeout(timer);
                        image.onload = null;
                        image.onerror = null;
                        resolve(isReady);
                    }

                    image.onload = () => finish(true);
                    image.onerror = () => finish(false);
                    image.src = withCacheBust(getLogoUrl(baseUrl));
                });
            }

            async function verifyMirror(baseUrl) {
                for (let attempt = 1; attempt <= REQUIRED_SUCCESSES; attempt += 1) {
                    showScannedMirror(baseUrl, attempt);
                    if (!(await checkLogo(baseUrl))) return false;
                    fallbackLogoEl.style.display = "none";
                    logoEl.style.display = "block";
                }
                return true;
            }

            function redirectTo(baseUrl) {
                const targetUrl = new URL(
                    path + window.location.search + window.location.hash,
                    baseUrl,
                );
                window.location.replace(targetUrl.href);
            }

            async function main() {
                let round = 1;
                while (true) {
                    for (const mirror of MIRRORS) {
                        if (await verifyMirror(mirror)) {
                            statusEl.textContent = "Сервер найден. Переходим...";
                            redirectTo(mirror);
                            return;
                        }
                    }
                    statusEl.className = "error";
                    statusEl.textContent = `Серверы не найдены. Повтор через ${RETRY_DELAY_MS / 1000} с...`;
                    serverNameEl.textContent = `Цикл проверки #${round}`;
                    round += 1;
                    await delay(RETRY_DELAY_MS);
                }
            }

            window.addEventListener("pageshow", (event) => {
                if (event.persisted) window.location.reload();
            });

            main();
        })();
    </script>
</body>

</html>
