    body {
        background-color: rgb(27, 27, 27);

</style>
<iframe id="kodik-player" src="//kodikplayer.com/serial/37172/55dacb8c87e072e0966bc39ddce66224/720p" width="610"
    height="370" frameborder="0" allowfullscreen allow="autoplay *; fullscreen *"></iframe>

<script type="text/javascript">



    function kodikMessageListener(message) {
        if (message.data.title == "mousemove") return
        if (message.data.title == "click") return


        console.log((new Date()).toLocaleTimeString(),"LOG: ",  message.data)
        if (message.data.key == 'kodik_player_time_update') {
            console.log(message.data.value);
        }
    }

    if (window.addEventListener) {
        window.addEventListener('message', kodikMessageListener);
    } else {
        window.attachEvent('onmessage', kodikMessageListener);
    }


</script>
