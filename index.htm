<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Подбор сервера | Track Anime</title>
    <link rel="canonical" href="https://track-anime.dygdyg.ru/">
    <link rel="icon" type="image/png" href="/favicon.png">

    <meta name="title" content="Track Anime By ДугДуг">
    <meta name="description" content="Сервис для просмотра аниме и отслеживания выхода новых серий в реальном времени.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://track-anime.dygdyg.ru/">
    <meta property="og:title" content="Track Anime By ДугДуг">
    <meta property="og:description" content="Сервис для просмотра аниме и отслеживания выхода новых серий в реальном времени.">
    <meta property="og:image" content="/favicon.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Track Anime By ДугДуг">
    <meta name="twitter:description" content="Сервис для просмотра аниме и отслеживания выхода новых серий в реальном времени.">
    <meta name="twitter:image" content="/favicon.png">

    <style>
        :root {
            color-scheme: dark;
            --bg: #101114;
            --panel: #181a20;
            --text: #f3f4f6;
            --muted: #a5adba;
            --accent: #57d39b;
            --danger: #ff6b6b;
            --border: #2d313a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #1c2430 0, var(--bg) 42%);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 520px);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            box-shadow: 0 24px 80px rgb(0 0 0 / 0.35);
            text-align: center;
        }

        .logo-wrap {
            width: min(76vw, 260px);
            height: min(76vw, 260px);
            margin: 0 auto 26px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0c0d10;
            overflow: hidden;
        }

        #brandLogo {
            display: none;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .fallback-logo {
            color: var(--accent);
            font-size: 64px;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            font-weight: 700;
        }

        p {
            margin: 0;
        }

        #status {
            min-height: 48px;
            color: var(--muted);
            line-height: 1.5;
        }

        #serverName {
            margin-top: 16px;
            color: var(--text);
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .loader {
            width: 40px;
            height: 40px;
            margin: 22px auto 0;
            border: 4px solid #30343d;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 900ms linear infinite;
        }

        .error {
            color: var(--danger);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 420px) {
            main {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="logo-wrap" aria-hidden="true">
            <img id="brandLogo" alt="">
            <div id="fallbackLogo" class="fallback-logo">TA</div>
        </div>
        <h1>Подбор сервера</h1>
        <p id="status">Инициализация...</p>
        <p id="serverName"></p>
        <div class="loader" aria-hidden="true"></div>
    </main>

    <script>
        const MIRRORS = [
            "https://track-anime.dygdyg.ru",
            "https://track-anime.duckdns.org",
            "https://ta.dygdyg.ru"
        ];

        const LOGO_PATH = "/api/brand/logo";
        const TIMEOUT_MS = 4000;
        const REQUIRED_SUCCESSES = 2;
        const RETRY_DELAY_MS = 3000;

        const statusEl = document.getElementById("status");
        const serverNameEl = document.getElementById("serverName");
        const logoEl = document.getElementById("brandLogo");
        const fallbackLogoEl = document.getElementById("fallbackLogo");

        const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        function withCacheBust(url) {
            const nextUrl = new URL(url);
            nextUrl.searchParams.set("_", String(Date.now()));
            return nextUrl.href;
        }

        function getLogoUrl(baseUrl) {
            return new URL(LOGO_PATH, baseUrl).href;
        }

        function showScannedMirror(baseUrl, attempt) {
            const logoUrl = withCacheBust(getLogoUrl(baseUrl));

            statusEl.className = "";
            statusEl.textContent = `Проверяем зеркало ${attempt}/${REQUIRED_SUCCESSES}`;
            serverNameEl.textContent = baseUrl;
            fallbackLogoEl.style.display = "grid";
            logoEl.style.display = "none";
            logoEl.removeAttribute("src");
            logoEl.src = logoUrl;
        }

        function checkLogo(baseUrl) {
            return new Promise((resolve) => {
                const image = new Image();
                const timer = setTimeout(() => finish(false), TIMEOUT_MS);

                function finish(isReady) {
                    clearTimeout(timer);
                    image.onload = null;
                    image.onerror = null;
                    resolve(isReady);
                }

                image.onload = () => finish(true);
                image.onerror = () => finish(false);
                image.src = withCacheBust(getLogoUrl(baseUrl));
            });
        }

        async function verifyMirror(baseUrl) {
            for (let attempt = 1; attempt <= REQUIRED_SUCCESSES; attempt += 1) {
                showScannedMirror(baseUrl, attempt);

                if (!(await checkLogo(baseUrl))) {
                    return false;
                }

                fallbackLogoEl.style.display = "none";
                logoEl.style.display = "block";
            }

            return true;
        }

        function redirectTo(baseUrl) {
            const targetUrl = new URL("/", baseUrl);
            targetUrl.search = window.location.search;
            targetUrl.hash = window.location.hash;
            window.location.replace(targetUrl.href);
        }

        async function main() {
            let round = 1;

            while (true) {
                for (const mirror of MIRRORS) {
                    if (await verifyMirror(mirror)) {
                        statusEl.textContent = "Сервер найден. Переходим...";
                        redirectTo(mirror);
                        return;
                    }
                }

                statusEl.className = "error";
                statusEl.textContent = `Серверы не найдены. Повтор через ${RETRY_DELAY_MS / 1000} с...`;
                serverNameEl.textContent = `Цикл проверки #${round}`;
                round += 1;
                await delay(RETRY_DELAY_MS);
            }
        }

        window.addEventListener("pageshow", (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        main();
    </script>
</body>

</html>
