    <style>
        body {
            font-family: system-ui, sans-serif;

        }

        .loader {
            margin: 20px auto;
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {

            }
        }

        }

<body>

    <div class="box">
        <h1>🌐 Подбор сервера</h1>
        <p id="status">Инициализация…</p>
        <div class="loader"></div>
    </div>

    <script>
        // ===============================
        // Конфигурация
        // ===============================
        const mirrors = [
            "https://track-anime.dygdyg.ru",
            "https://track-anime.duckdns.org",
            "https://ta.dygdyg.ru",
            // "https://server.dygdyg.ru",
            // "https://dygdyg.duckdns.org"
        ];

        const CHECK_PATH = "/scripts/moment.js";
        const TIMEOUT = 4000;
        const REQUIRED_SUCCESSES = 3;
        const RETRY_DELAY = 3000;

        // ===============================
        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        // ===============================
        // Одна проверка
        // ===============================
        async function checkOnce(baseUrl) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), TIMEOUT);

            try {
                await fetch(
                    `${baseUrl}${CHECK_PATH}?nocache=${crypto.randomUUID()}`,
                    {
                        mode: "no-cors",
                        cache: "no-store",
                        signal: controller.signal
                    }
                );
                return true;
            } catch {
                return false;
            } finally {
                clearTimeout(timeout);
            }
        }

        // ===============================
        // Проверка стабильности (3/3)
        // ===============================
        async function verifyMirror(baseUrl, statusEl) {
            for (let i = 1; i <= REQUIRED_SUCCESSES; i++) {
                statusEl.textContent =
                    `Проверка ${baseUrl} (${i}/${REQUIRED_SUCCESSES})…`;

                if (!(await checkOnce(baseUrl))) {
                    return false;
                }
            }
            return true;
        }

        // ===============================
        // Основной бесконечный цикл
        // ===============================
        (async function mainLoop() {
            const status = document.getElementById("status");
            let round = 1;

            while (true) {
                status.textContent = `🔁 Цикл проверки #${round}`;

                for (const mirror of mirrors) {
                    if (await verifyMirror(mirror, status)) {
                        // редирект СРАЗУ
                        const params = new URLSearchParams(window.location.search);
                        // params.set("_ts", Date.now());

                        window.location.replace(
                            `${mirror}/?${params.toString()}`
                        );
                        return;
                    }
                }

                status.innerHTML =
                    `<span class="error">❌ Серверы не найдены, повтор через ${RETRY_DELAY / 1000}с…</span>`;

                round++;
                await sleep(RETRY_DELAY);
            }
        })();

        // ===============================
        // Отключаем BFCache
        // ===============================
        window.addEventListener("pageshow", e => {
            if (e.persisted) location.reload();
        });
    </script>

</body>
